<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#064e3b">
    <title>You're offline · School ERP</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7f4; color: #10251d; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
      main { width: min(100%, 26rem); border: 1px solid #d8e2dc; border-radius: 1.25rem; background: white; padding: 1.5rem; box-shadow: 0 12px 36px #0b24151a; }
      p { line-height: 1.6; color: #40574a; }
      button { min-height: 3rem; border: 0; border-radius: .75rem; background: #064e3b; color: white; font: inherit; font-weight: 650; padding: 0 1rem; }
    </style>
  </head>
  <body><main><p><strong>SCHOOL ERP</strong></p><h1>You're offline</h1><p>This screen does not save school data. Reconnect to the internet and try again. Any unsent work will be available only after the relevant offline workflow is enabled.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
